name: RexTennis
options:
  bundleIdPrefix: com.taicheng525
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.0.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "N7W8Q9AW3F"   # 付费个人开发者账号（Taicheng Chen / Individual）——上架用这个

targets:
  RexTennis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - Voices
      # 内置裁判人声：按 语言_性别 子目录整目录打包（folder reference），运行时按子目录取文件
      - path: Resources/Voices
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: RexTennis
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        # App 完全离线、不含自定义加密：声明后每次上传 TestFlight/App Store 不再弹「出口合规」问卷
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taicheng525.RexTennis
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/BridgingHeader.h

  RexTennisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: RexTennis
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.taicheng525.RexTennisTests

schemes:
  RexTennis:
    build:
      targets:
        RexTennis: all
        RexTennisTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RexTennisTests
